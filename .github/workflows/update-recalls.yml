name: Update recall data

# Runs on YOUR self-hosted Windows runner, so the USDA fetch comes from a
# residential IP (works via curl_cffi). Triggers are schedule + manual only —
# never pull_request — so fork PRs can't run code on your machine.
on:
  schedule:
    - cron: "17 8 * * *"     # daily at 08:17 UTC (runs when your runner is online)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    # Requires a self-hosted Windows x64 runner registered on this repo.
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: powershell
        run: pip install curl_cffi pillow

      - name: Fetch recalls (this year + last year)
        shell: powershell
        run: |
          $Y = (Get-Date).Year
          python fetch_recalls.py --year $Y
          python fetch_recalls.py --year ($Y - 1)

      - name: Rebuild the published site (docs/)
        shell: powershell
        run: |
          python build_dashboard.py
          python build_mobile.py
          New-Item -ItemType Directory -Force -Path docs | Out-Null
          Copy-Item dashboard.html docs\dashboard.html -Force
          Copy-Item recall_monitor_mobile.html docs\index.html -Force
          New-Item -ItemType File -Force -Path docs\.nojekyll | Out-Null

      - name: Commit and push if anything changed
        shell: powershell
        run: |
          git config user.name  "recall-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git status --porcelain) {
            git commit -m "Daily recall data update ($(Get-Date -Format yyyy-MM-dd))"
            git push
          } else {
            Write-Host "No changes to commit."
          }
