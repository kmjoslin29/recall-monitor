name: Update recall data

# Runs once a day, and can also be run on demand from the Actions tab.
on:
  schedule:
    - cron: "17 8 * * *"     # daily at 08:17 UTC (GitHub may delay busy runs)
  workflow_dispatch: {}

# Let the job commit the rebuilt site back to the repo.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # curl_cffi = USDA (browser-TLS bypass); pillow = home-screen icon.
        run: pip install curl_cffi pillow

      - name: Fetch recalls (this year + last year)
        # A USDA block is treated as a non-error: the fetcher notes it, keeps the
        # USDA data already committed, and moves on — so this step succeeds and
        # FDA still updates even if USDA can't be reached from GitHub's servers.
        run: |
          YEAR=$(date -u +%Y)
          python fetch_recalls.py --year "$YEAR"
          python fetch_recalls.py --year "$((YEAR - 1))"

      - name: Rebuild the published site (docs/)
        run: |
          python build_dashboard.py
          python build_mobile.py
          mkdir -p docs
          cp dashboard.html docs/dashboard.html
          cp recall_monitor_mobile.html docs/index.html
          touch docs/.nojekyll

      - name: Commit and push if anything changed
        run: |
          git config user.name  "recall-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Daily recall data update ($(date -u +%Y-%m-%d))" \
            || { echo "No changes to commit."; exit 0; }
          git push
